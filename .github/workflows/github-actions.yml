name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py311, py312]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: ${{ matrix.environment }}
          locked: true
      - name: test
        run: pixi run -e ${{ matrix.environment }} test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          locked: true
      - name: lint
        run: pixi run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: build
          locked: true
      - name: build distributions
        run: pixi run -e build build-wheel
      - name: check distributions
        run: pixi run -e build check-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: publish to PyPI
    # Only on a v* tag. Uses PyPI trusted publishing, so no API token is stored:
    # the `pypi` environment must be registered as the publisher for this repo.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
